name: Install test
# Runs the README's one-line installer against the published latest release.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:trixie', 'fedora:41']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Prerequisites (curl, sudo)
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y curl sudo ca-certificates; else dnf install -y curl sudo; fi
      - name: One-line install from the README
        run: curl -fsSL https://raw.githubusercontent.com/evman/silage/main/install.sh | sh
      - name: Run it
        run: |
          silage --version
          silage --check

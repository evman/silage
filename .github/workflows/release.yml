name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NFPM_VERSION: '2.47.0'
  NFPM_SHA256: '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783'

jobs:
  runtime:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install private renderer build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git meson ninja python pkgconf mpv shaderc vulkan-headers vulkan-icd-loader vulkan-swrast wayland-protocols libpipewire luajit patchelf
      - name: Build and test the pinned renderer
        run: bash scripts/dv-helper/build_runtime.sh
      - name: Export libraries, licenses and corresponding sources
        run: python3 scripts/dv-helper/release_runtime.py --runtime build/dv-runtime/install --export build/release-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: playback-runtime
          path: build/release-runtime/

  build:
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: playback-runtime
          path: build/release-runtime
      - name: Install nfpm
        run: |
          curl -sSfL -o /tmp/nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: Install playback and test dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv2 ffmpeg dbus xvfb libdrm-dev pkg-config
      - name: Test helper lifecycle and packaging
        run: |
          python3 -m unittest discover -s scripts/dv-helper -v
          python3 -m unittest discover -s scripts/dv-lab -v
          python3 -m unittest discover -s scripts/tests -v
      - name: Test Linux
        run: xvfb-run -a ./gradlew --no-daemon :app:test :player:test :shared:desktopTest -PappVersion="${GITHUB_REF_NAME#v}"
      - name: Build packages
        env:
          SILAGE_LINUX_DV_BUNDLE: build/release-runtime
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Include corresponding playback sources
        run: cp build/release-runtime/silage-playback-runtime-sources.tar.gz dist/
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare bundled playback dependencies
        shell: pwsh
        run: ./scripts/prepare-windows.ps1
      - name: Test Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & ./build-windows.cmd :app:test :player:test :shared:desktopTest --no-daemon --console=plain "-PappVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          cmd /d /c "package-windows.cmd -PappVersion=$version <nul"
          if ($LASTEXITCODE -ne 0) { Get-Content package-windows.log; exit $LASTEXITCODE }
          $versionFile = Join-Path $env:RUNNER_TEMP 'silage-version.txt'
          $probe = Start-Process ./dist/Silage/silage.exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionFile
          if ($probe.ExitCode -ne 0) { throw 'Version probe failed' }
          $reported = (Get-Content $versionFile -Raw).Trim()
          if ($reported -ne "Silage $version") { throw "Unexpected build version: $reported" }
          $check = Start-Process ./dist/Silage/silage.exe -ArgumentList '--check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Bundled playback check failed' }
          foreach ($name in "Silage-$version-Setup.exe", 'Silage-Setup.exe') {
            if (-not (Test-Path "dist/$name")) { throw "Installer missing: dist/$name" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          compression-level: 0
          path: |
            dist/Silage-*-Setup.exe
            dist/Silage-Setup.exe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-release-diagnostics
          path: |
            package-windows.log
            **/build/reports/tests/

  test-deb:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the .deb
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/silage_*.deb
      - name: Run it
        run: |
          silage --version
          silage --check
          /usr/libexec/silage-dv-helper/silage-dv-helper --version
          test "$(stat -c '%u:%a' /usr/libexec/silage-dv-helper/silage-dv-helper)" = '0:755'

  test-rpm:
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the .rpm
        run: dnf install -y ./dist/silage-*.rpm
      - name: Run it
        run: |
          silage --version
          silage --check
          /usr/libexec/silage-dv-helper/silage-dv-helper --version
          test "$(stat -c '%u:%a' /usr/libexec/silage-dv-helper/silage-dv-helper)" = '0:755'

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Build the Arch package from the PKGBUILD
        run: |
          pacman -Syu --noconfirm --needed base-devel
          v="${GITHUB_REF_NAME#v}"
          useradd -m builder
          mkdir /build && cp packaging/aur/PKGBUILD "dist/silage-$v-linux-x86_64.tar.gz" /build/
          cd /build
          sum=$(sha256sum "silage-$v-linux-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=$v/; s/^sha256sums=.*/sha256sums=('$sum')/" PKGBUILD
          mkdir -p "$GITHUB_WORKSPACE/arch"
          cp PKGBUILD "$GITHUB_WORKSPACE/arch/PKGBUILD"
          # Build from the tarball in hand (the release URL doesn't exist yet).
          sed -i 's|^source=.*|source=("silage-$pkgver-linux-x86_64.tar.gz")|' PKGBUILD
          chown -R builder /build
          su builder -c "makepkg --nodeps --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/arch" && cp silage-bin-*.pkg.tar.zst "$GITHUB_WORKSPACE/arch/"
      - name: Install it with pacman and run it
        run: |
          pacman -U --noconfirm arch/silage-bin-*.pkg.tar.zst
          silage --version
          silage --check
          /usr/libexec/silage-dv-helper/silage-dv-helper --version
          test "$(stat -c '%u:%a' /usr/libexec/silage-dv-helper/silage-dv-helper)" = '0:755'
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: arch/

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate packaging/dev.silage.Silage.desktop
      - run: appstreamcli validate --no-net packaging/dev.silage.Silage.metainfo.xml

  release:
    needs: [build, windows, test-deb, test-rpm, arch, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: arch
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/$v/g" packaging/release-notes.md > /tmp/notes.md
          # Version-free copies, so releases/latest/download/<name> always gets the newest.
          cp "dist/silage_${v}_amd64.deb" dist/silage_amd64.deb
          cp "dist/silage-${v}-1.x86_64.rpm" dist/silage.x86_64.rpm
          cp "dist/silage-${v}-linux-x86_64.tar.gz" dist/silage-linux-x86_64.tar.gz
          cp dist/silage-bin-"${v}"-*-x86_64.pkg.tar.zst dist/silage-bin-x86_64.pkg.tar.zst
          (cd dist && sha256sum ./*.tar.gz ./*.deb ./*.rpm ./*.pkg.tar.zst ./Silage-*-Setup.exe ./Silage-Setup.exe PKGBUILD | sed 's| \./| |' > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "Silage $v" --notes-file /tmp/notes.md \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/Silage-*-Setup.exe dist/Silage-Setup.exe dist/PKGBUILD dist/SHA256SUMS

  # Releases made with GITHUB_TOKEN don't trigger other workflows, so the
  # README installer is tested here, against the release just published.
  install-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:trixie', 'fedora:41', 'archlinux:latest']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Prerequisites (curl, sudo)
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y curl sudo ca-certificates
          elif command -v dnf >/dev/null; then dnf install -y curl sudo
          else pacman -Syu --noconfirm --needed curl sudo; fi
      - name: One-line install from the README
        run: curl -fsSL https://raw.githubusercontent.com/evman/silage/main/install.sh | sh
      - name: Run it
        run: |
          silage --version
          silage --check


  # Installs the published setup the way a person (or the in-app updater) does,
  # upgrades over it, then uninstalls it and checks the settings are kept.
  install-windows:
    needs: release
    runs-on: windows-2022
    steps:
      - name: Download the published installer and verify its checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $setup = "Silage-$version-Setup.exe"
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $setup --pattern SHA256SUMS --dir download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $entry = Get-Content download/SHA256SUMS | Where-Object { $_ -match "  $([regex]::Escape($setup))$" }
          if (-not $entry) { throw "$setup checksum missing" }
          $actual = (Get-FileHash "download/$setup" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne ($entry -split '\s+')[0]) { throw "$setup checksum mismatch" }
      - name: Install, upgrade and uninstall
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $setup = Resolve-Path "download/Silage-$version-Setup.exe"
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Silage'
          $exe = Join-Path $app 'silage.exe'
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'Silage.lnk'),
            (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Silage.lnk'))
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{EC6708E9-2E25-4B67-A3D7-666423B0CD00}_is1'
          # Settings that must survive a silent uninstall.
          $settings = Join-Path $env:APPDATA 'Silage'
          New-Item -ItemType Directory -Force $settings | Out-Null
          Set-Content (Join-Path $settings 'marker.txt') 'keep me'

          function Install-Silage([string]$log) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Setup exited with $($p.ExitCode)" }
          }
          function Assert-Installed {
            if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
            $check = Start-Process $exe -ArgumentList '--check' -Wait -PassThru
            if ($check.ExitCode -ne 0) { throw 'Installed silage.exe failed its playback check' }
            $versionFile = Join-Path $env:RUNNER_TEMP 'installed-silage-version.txt'
            $probe = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionFile
            if ($probe.ExitCode -ne 0) { throw 'Installed version probe failed' }
            $reported = (Get-Content $versionFile -Raw).Trim()
            if ($reported -ne "Silage $version") { throw "Unexpected installed version: $reported" }
            foreach ($lnk in $shortcuts) { if (-not (Test-Path $lnk)) { throw "Shortcut missing: $lnk" } }
            if (-not (Test-Path $uninstallKey)) { throw 'Uninstall entry missing' }
            $listed = (Get-ItemProperty $uninstallKey).DisplayVersion
            if ($listed -ne $version) { throw "Uninstall entry lists version $listed" }
          }

          Install-Silage (Join-Path $env:RUNNER_TEMP 'install.log')
          Assert-Installed
          # The updater installs a newer setup over the running install the same way.
          Install-Silage (Join-Path $env:RUNNER_TEMP 'upgrade.log')
          Assert-Installed

          $u = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with $($u.ExitCode)" }
          # The uninstaller finishes from a copy of itself in %TEMP%, so wait for the folder to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Get-ChildItem $app -Recurse | Select-Object -ExpandProperty FullName; throw "App folder left behind: $app" }
          foreach ($lnk in $shortcuts) { if (Test-Path $lnk) { throw "Shortcut left behind: $lnk" } }
          if (Test-Path $uninstallKey) { throw 'Uninstall entry left behind' }
          if ((Get-Content (Join-Path $settings 'marker.txt') -ErrorAction SilentlyContinue) -ne 'keep me') {
            throw 'A silent uninstall deleted the settings'
          }

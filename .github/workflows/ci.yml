name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install mpv, ffmpeg and a virtual display
        run: sudo apt-get update && sudo apt-get install -y libmpv2 ffmpeg xvfb
      - name: Test
        run: xvfb-run -a ./gradlew --no-daemon test :shared:desktopTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
